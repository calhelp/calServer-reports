---
name: Validate Reports

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JasperReports version comments
        run: bash scripts/check_jasper_version.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: pip install jsonschema

      # Parameter-Manifeste (parameters.json) gibt es NUR in V2-JSON-Bundles
      # (kein eingebettetes SQL). Der Check validiert gegen
      # schema/report-parameters.schema.json und das jeweilige Haupt-JRXML.
      - name: Check parameter manifests
        run: python3 scripts/check_parameters_manifest.py

      # Prüfplan-Pakete (calserver.procedure-package, PRUEFPLAN-*): Manifest
      # gegen schema/procedure-package.schema.json, sha256-Parität in beide
      # Richtungen, Eintrags-Allowlist, procedure.json-Kopf.
      - name: Check Prüfplan package manifests
        run: python3 scripts/build_pruefplan_manifest.py --check

      # Wiki-Pakete (calserver.wiki-package, WIKI-*): Manifest gegen
      # schema/wiki-package.schema.json, sha256-Parität in beide Richtungen,
      # Eintrags-Allowlist, wiki.json-Kopf sowie inhaltliche Vollständigkeit
      # (jede Seite mit Kategorie, keine Sprache doppelt je Artikel, jedes
      # referenzierte Bild vorhanden).
      - name: Check Wiki package manifests
        run: python3 scripts/build_wiki_manifest.py --check

      # Konfigurationspakete (calserver.category-package /
      # calserver.status-package / calserver.ticket-config-package,
      # CATEGORY-*/STATUS-*/TICKET-CONFIG-*): Manifest gegen das
      # jeweilige Schema, sha256-Parität in beide Richtungen,
      # Eintrags-Allowlist sowie inhaltliche Prüfungen (Schlüssel eindeutig,
      # parent_key aufloesbar, Folgeaktionen zeigen auf Status des Pakets,
      # Risiko-Matrix deckt den erreichbaren Wertebereich ab).
      - name: Check config package manifests
        run: python3 scripts/build_config_manifest.py --check

      # TICKET-CONFIG-DAKKS-3D wird aus der Zwei-Methoden-Fassung abgeleitet,
      # nicht von Hand gepflegt — sonst laufen die Kataloge auseinander.
      - name: Check derived three-method ticket configuration
        run: python3 scripts/build_ticket_config_3d.py --check

      # DCC 3.3.0 Export: xmlschema erlaubt echte Validierung gegen dcc-v3.3.0.xsd
      # (mit remote SI-/dsig-Imports). Der Check überspringt die XSD-Prüfung
      # anstandslos, falls das Schema offline nicht ladbar ist.
      - name: Install xmlschema
        run: pip install xmlschema

      # Regeneriert das DCC-Sample deterministisch (Parität), prüft Struktur
      # und validiert gegen das offizielle PTB-DCC-3.3.0-Schema.
      - name: Check DCC 3.3.0 export
        run: python3 scripts/check_dcc330.py
